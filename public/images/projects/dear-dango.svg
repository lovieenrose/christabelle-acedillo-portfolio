<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dango-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="phone-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#dango-bg)" />

  <!-- Title & Description Left Side -->
  <g transform="translate(60, 80)">
    <rect width="130" height="26" rx="13" fill="#047857" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
    <text x="14" y="17" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Android Mobile App</text>
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="700">Dear Dango</text>
    <text x="0" y="100" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="16" font-weight="500">Personal Daily Diary &amp; Mood Tracker</text>
    <text x="0" y="140" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Native Android application crafted with Kotlin and Android Studio.</text>
    <text x="0" y="162" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Features daily prompts, mood journaling, timestamped notes,</text>
    <text x="0" y="184" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">and clean pastel UI aesthetics.</text>

    <!-- Tech tags -->
    <g transform="translate(0, 215)">
      <rect width="70" height="26" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="14" y="17" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Kotlin</text>
      <rect x="80" width="120" height="26" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="94" y="17" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Android Studio</text>
      <rect x="210" width="80" height="26" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="224" y="17" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Room DB</text>
    </g>
  </g>

  <!-- Mobile Mockup Frame (Right Side) -->
  <g transform="translate(500, 30)">
    <!-- Phone Bezel -->
    <rect width="240" height="390" rx="36" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <!-- Dynamic Island / Speaker notch -->
    <rect x="80" y="12" width="80" height="14" rx="7" fill="#1e293b" />
    
    <!-- Phone Inner Display -->
    <rect x="10" y="32" width="220" height="346" rx="26" fill="url(#phone-screen)" />
    
    <!-- App UI Inside Phone -->
    <text x="24" y="64" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">🍡 Dear Dango</text>
    <text x="24" y="80" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10">Today, 8:45 PM · Sunny</text>

    <!-- Mood Selector -->
    <rect x="20" y="96" width="200" height="42" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="32" y="122" fill="#ffffff" font-size="18">😊</text>
    <text x="70" y="122" fill="#ffffff" font-size="18">😌</text>
    <text x="108" y="122" fill="#ffffff" font-size="18">🥰</text>
    <text x="146" y="122" fill="#ffffff" font-size="18">😴</text>
    <text x="184" y="122" fill="#ffffff" font-size="18">✨</text>

    <!-- Journal Card 1 -->
    <rect x="20" y="150" width="200" height="88" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="172" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Capstone Defense Prep</text>
    <text x="32" y="190" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Sprint retro went smoothly today!</text>
    <text x="32" y="206" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Turned in the client portal specs.</text>
    <text x="32" y="224" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Nov 6 · 4:15 PM</text>

    <!-- Journal Card 2 -->
    <rect x="20" y="248" width="200" height="74" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="270" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Learning Jetpack Compose</text>
    <text x="32" y="288" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Practiced state hoists and UI themes.</text>
    <text x="32" y="306" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Nov 5 · 9:30 PM</text>

    <!-- Floating Add Button -->
    <circle cx="190" cy="345" r="16" fill="#10b981" />
    <text x="184" y="351" fill="#ffffff" font-size="18" font-weight="bold">+</text>
  </g>
</svg>

