<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="thrift-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="thrift-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#thrift-bg)" />

  <!-- Navbar -->
  <rect x="30" y="24" width="740" height="50" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
  <g transform="translate(48, 38)">
    <circle cx="9" cy="9" r="7" fill="none" stroke="#f43f5e" stroke-width="2" />
    <path d="M9 5v4l2.5 2.5" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
  </g>
  <text x="76" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Thrifster</text>
  <text x="146" y="55" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Vintage &amp; Pre-loved Apparel</text>

  <!-- Cart pill -->
  <rect x="650" y="36" width="105" height="26" rx="13" fill="#e11d48" />
  <text x="670" y="53" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🛒 Cart (2 items)</text>

  <!-- Store catalog -->
  <rect x="30" y="90" width="740" height="330" rx="10" fill="url(#thrift-card)" stroke="#3f3f46" stroke-width="1" />
  <text x="52" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Curated Thrift Collection · E-Commerce Platform</text>
  <text x="52" y="145" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Feature: Interactive Add-to-Cart Module &amp; Session Management · Built with PHP &amp; MySQL</text>

  <!-- Product 1 -->
  <g transform="translate(52, 170)">
    <rect width="216" height="230" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <!-- Image placeholder area -->
    <rect x="12" y="12" width="192" height="110" rx="6" fill="#3f3f46" opacity="0.6"/>
    <text x="68" y="72" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="12">🧥 Vintage Denim</text>
    <text x="14" y="144" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">90s Oversized Denim Jacket</text>
    <text x="14" y="164" fill="#fb7185" font-family="system-ui, sans-serif" font-size="14" font-weight="700">₱450.00</text>
    <rect x="14" y="180" width="188" height="34" rx="6" fill="#e11d48"/>
    <text x="60" y="202" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Added to Cart</text>
  </g>

  <!-- Product 2 -->
  <g transform="translate(292, 170)">
    <rect width="216" height="230" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <rect x="12" y="12" width="192" height="110" rx="6" fill="#3f3f46" opacity="0.6"/>
    <text x="70" y="72" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="12">👕 Retro Graphic</text>
    <text x="14" y="144" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Band Tour Tee (Black / L)</text>
    <text x="14" y="164" fill="#fb7185" font-family="system-ui, sans-serif" font-size="14" font-weight="700">₱280.00</text>
    <rect x="14" y="180" width="188" height="34" rx="6" fill="#27272a" stroke="#fb7185" stroke-width="1"/>
    <text x="68" y="202" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="600">+ Add to Cart</text>
  </g>

  <!-- Product 3 -->
  <g transform="translate(532, 170)">
    <rect width="216" height="230" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <rect x="12" y="12" width="192" height="110" rx="6" fill="#3f3f46" opacity="0.6"/>
    <text x="70" y="72" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="12">👗 Corduroy Skirt</text>
    <text x="14" y="144" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">A-Line Corduroy Button Skirt</text>
    <text x="14" y="164" fill="#fb7185" font-family="system-ui, sans-serif" font-size="14" font-weight="700">₱320.00</text>
    <rect x="14" y="180" width="188" height="34" rx="6" fill="#27272a" stroke="#fb7185" stroke-width="1"/>
    <text x="68" y="202" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="600">+ Add to Cart</text>
  </g>
</svg>
