<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="lib-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1e38" />
    </linearGradient>
    <linearGradient id="lib-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#lib-bg)" />

  <!-- Navbar -->
  <rect x="30" y="24" width="740" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <g transform="translate(48, 38)">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" fill="none" stroke="#818cf8" stroke-width="2" />
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" fill="none" stroke="#818cf8" stroke-width="2" />
  </g>
  <text x="76" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">The Catalog Library</text>
  <rect x="230" y="38" width="80" height="22" rx="4" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
  <text x="240" y="53" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Admin Portal</text>
  <rect x="560" y="36" width="190" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="575" y="53" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">🔍 Search ISBN, Title, Author...</text>

  <!-- Main Catalog Grid -->
  <rect x="30" y="90" width="740" height="330" rx="10" fill="url(#lib-card)" stroke="#334155" stroke-width="1" />
  <text x="52" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Books &amp; Borrowing Management System</text>
  <text x="52" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">PHP · MySQL (phpMyAdmin) · Localhost Version · Multi-user Authentication</text>

  <!-- Stats row -->
  <g transform="translate(52, 165)">
    <rect width="150" height="56" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">CATALOG BOOKS</text>
    <text x="12" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">1,420</text>
  </g>
  <g transform="translate(216, 165)">
    <rect width="150" height="56" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">BORROWED</text>
    <text x="12" y="46" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="20" font-weight="700">86</text>
  </g>
  <g transform="translate(380, 165)">
    <rect width="150" height="56" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">RETURNED ON TIME</text>
    <text x="12" y="46" fill="#34d399" font-family="system-ui, sans-serif" font-size="20" font-weight="700">97.2%</text>
  </g>

  <!-- Table mock -->
  <rect x="52" y="238" width="696" height="34" rx="4" fill="#1e293b" />
  <text x="70" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ACCESSION #</text>
  <text x="200" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TITLE &amp; AUTHOR</text>
  <text x="460" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STATUS</text>
  <text x="600" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ACTION</text>

  <!-- Row 1 -->
  <rect x="52" y="280" width="696" height="38" rx="4" fill="#0f172a" stroke="#1e293b" />
  <text x="70" y="304" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">LIB-2025-081</text>
  <text x="200" y="304" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Clean Code · Robert C. Martin</text>
  <rect x="460" y="290" width="70" height="18" rx="9" fill="#065f46" />
  <text x="475" y="303" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10">Available</text>
  <text x="600" y="304" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11">Issue Book →</text>

  <!-- Row 2 -->
  <rect x="52" y="326" width="696" height="38" rx="4" fill="#0f172a" stroke="#1e293b" />
  <text x="70" y="350" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">LIB-2025-142</text>
  <text x="200" y="350" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Design Patterns · Gang of Four</text>
  <rect x="460" y="336" width="70" height="18" rx="9" fill="#78350f" />
  <text x="472" y="349" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10">Borrowed</text>
  <text x="600" y="350" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11">Return →</text>

  <!-- Row 3 -->
  <rect x="52" y="372" width="696" height="36" rx="4" fill="#0f172a" stroke="#1e293b" />
  <text x="70" y="394" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">LIB-2025-204</text>
  <text x="200" y="394" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Web Development with Node &amp; Express</text>
  <rect x="460" y="380" width="70" height="18" rx="9" fill="#065f46" />
  <text x="475" y="393" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10">Available</text>
  <text x="600" y="394" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11">Issue Book →</text>
</svg>
